name = "distribusi-backend"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "distribusi-db"
database_id = "local-dev-db"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "distribusi-storage"

[vars]
JWT_SECRET = "dev-secret-change-in-production"
CORS_ORIGIN = "http://localhost:5173"
